# 源文档: Qx接口-C07 性能管理.docx
#   覆盖: 性能数据查询(当前/历史 15min+24h) + 屏蔽设置 + 门限设置 + 维护操作(复位/归零/上报开关)
schema:
  namespace: "perf"

messages:

  # ===================================================================
  #  性能 Trap 上报（设备 → EMS，只有 response 没有 request）
  # ===================================================================

  # 0x0D01 — 上报当前15分钟性能 Trap
  # C 结构体: STRU_PEF_Qx_Active_Trap (20 bytes)
  # 注：0x0C06/0x0C07/0x0C08/0x0C09 的查询响应也复用此结构体
  - cmdCode: 0x0D01
    operation: "上报当前15分钟性能"
    response:
      className: "PerfActive15MTrapData"
      listRecord: true
      fields: &activeTrapDataFields
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号（bit7=Invalid PM, 0=有效/1=无效; bit6=高/低32位指示, 0=低32位/1=高32位）" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "物理端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号（0=物理端口本身）" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（用于描述级联）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: performanceValue, type: INT,  desc: "性能值" }
        - { name: perTime,         type: INT,   desc: "性能时间（Unix时间戳，相对于1970年的秒数）" }

  # 0x0D02 — 上报当前24小时性能 Trap
  - cmdCode: 0x0D02
    operation: "上报当前24小时性能"
    response:
      className: "PerfActiveTrapData"
      listRecord: true
      fields: *activeTrapDataFields

  # ===================================================================
  #  性能屏蔽 Set/Get — 0x0A01 / 0x0C01
  # ===================================================================

  # 0x0A01 — 性能屏蔽设置
  # C 结构体: STRU_PEF_Qx_Mask_Set (14 bytes)
  - cmdCode: 0x0A01
    operation: "性能屏蔽设置"
    request:
      className: "PerfMaskSetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  default: 0xFF,   desc: "子架序号" }
        - { name: slotId,          type: BYTE,  default: 0xFF,   desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, default: 0xFFFF, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, default: 0xFFFF, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（用于描述级联）" }
        - { name: maskState,       type: BYTE,  desc: "屏蔽状态（1=屏蔽, 2=不屏蔽）" }
        - { name: backup1,         type: BYTE,  desc: "备用字节" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: backup2,         type: SHORT, desc: "备用字节" }

  # 0x0C01 — 性能屏蔽查询
  # C 请求: STRU_PEF_Qx_Mask_Get (12 bytes)
  # C 响应: STRU_PEF_Qx_Mask_Ack (14 bytes)
  - cmdCode: 0x0C01
    operation: "性能屏蔽查询"
    request:
      className: "PerfMaskGetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  default: 0xFF,   desc: "子架序号" }
        - { name: slotId,          type: BYTE,  default: 0xFF,   desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, default: 0xFFFF, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, default: 0xFFFF, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
    response:
      className: "PerfMaskQueryResult"
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽" }
        - { name: maskState,       type: BYTE,  desc: "屏蔽状态（1=屏蔽, 2=不屏蔽）" }
        - { name: backup1,         type: BYTE,  desc: "备用字节" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: backup2,         type: SHORT, desc: "备用字节" }
  # ===================================================================
  #  15分钟/24小时性能越限主动上报设置 — 0x0A02 / 0x0A03
  # ===================================================================

  # 0x0A02 — 15分钟性能越限主动上报设置
  # C 结构体: STRU_PEF_Qx_OverflowAutoRpt_Set (14 bytes)
  - cmdCode: 0x0A02
    operation: "15分钟性能越限主动上报设置"
    request:
      className: "PerfOverflowAutoRpt15MSetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  default: 0xFF,   desc: "子架序号" }
        - { name: slotId,          type: BYTE,  default: 0xFF,   desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, default: 0xFFFF, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, default: 0xFFFF, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（用于描述级联）" }
        - { name: backup,          type: BYTE,  desc: "备用字节" }
        - { name: autoRpt,         type: BYTE,  desc: "是否主动上报（1=主动上报, 2=不主动上报）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: backup2,         type: SHORT, desc: "备用字节" }

  # 0x0A03 — 24小时性能越限主动上报设置
  # 结构体同 0x0A02 (STRU_PEF_Qx_OverflowAutoRpt_Set)
  - cmdCode: 0x0A03
    operation: "24小时性能越限主动上报设置"
    request:
      className: "PerfOverflowAutoRpt24HSetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  default: 0xFF,   desc: "子架序号" }
        - { name: slotId,          type: BYTE,  default: 0xFF,   desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, default: 0xFFFF, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, default: 0xFFFF, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（用于描述级联）" }
        - { name: backup,          type: BYTE,  desc: "备用字节" }
        - { name: autoRpt,         type: BYTE,  desc: "是否主动上报（1=主动上报, 2=不主动上报）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: backup2,         type: SHORT, desc: "备用字节" }

  # ===================================================================
  #  15分钟/24小时性能越限主动上报查询 — 0x0C02 / 0x0C03
  # ===================================================================

  # 0x0C02 — 15分钟性能越限主动上报查询
  # C 请求: STRU_PEF_Qx_OverflowAutoRpt_Get (12 bytes)
  # C 响应: STRU_PEF_Qx_OverflowAutoRpt_Ack (14 bytes)
  - cmdCode: 0x0C02
    operation: "15分钟性能越限主动上报查询"
    request:
      className: "PerfOverflowAutoRpt15MGetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  default: 0xFF,   desc: "子架序号" }
        - { name: slotId,          type: BYTE,  default: 0xFF,   desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, default: 0xFFFF, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, default: 0xFFFF, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
    response:
      className: "PerfOverflowAutoRpt15MQueryResult"
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽" }
        - { name: backup,          type: BYTE,  desc: "备用字节" }
        - { name: autoRpt,         type: BYTE,  desc: "是否主动上报（1=主动上报, 2=不主动上报）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: backup2,         type: SHORT, desc: "备用字节" }

  # ===================================================================
  #  15分钟/24小时性能门限设置 — 0x0A04 / 0x0A05
  # ===================================================================

  # 0x0A04 — 15分钟性能门限设置
  # C 结构体: STRU_PEF_Qx_PfeThreshold_Set (12 bytes)
  - cmdCode: 0x0A04
    operation: "15分钟性能门限设置"
    request:
      className: "PerfThreshold15MSetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  default: 0xFF,   desc: "子架序号" }
        - { name: slotId,          type: BYTE,  default: 0xFF,   desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, default: 0xFFFF, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, default: 0xFFFF, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（用于描述级联）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: thresholdUpper,  type: INT,   desc: "性能门限上限值" }

  # 0x0A05 — 24小时性能门限设置
  # 结构体同 0x0A04 (STRU_PEF_Qx_PfeThreshold_Set)
  - cmdCode: 0x0A05
    operation: "24小时性能门限设置"
    request:
      className: "PerfThreshold24HSetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  default: 0xFF,   desc: "子架序号" }
        - { name: slotId,          type: BYTE,  default: 0xFF,   desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, default: 0xFFFF, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, default: 0xFFFF, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（用于描述级联）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: thresholdUpper,  type: INT,   desc: "性能门限上限值" }

  # ===================================================================
  #  15分钟/24小时性能门限查询 — 0x0C04 / 0x0C05
  # ===================================================================

  # 0x0C04 — 15分钟性能门限查询
  # C 请求: STRU_PEF_Qx_PfeThreshold_Get (12 bytes)
  # C 响应: STRU_PEF_Qx_PfeThreshold_Ack (12 bytes)
  - cmdCode: 0x0C04
    operation: "15分钟性能门限查询"
    request:
      className: "PerfThreshold15MGetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  default: 0xFF,   desc: "子架序号" }
        - { name: slotId,          type: BYTE,  default: 0xFF,   desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, default: 0xFFFF, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, default: 0xFFFF, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
    response:
      className: "PerfThreshold15MQueryResult"
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: thresholdUpper,  type: INT,   desc: "性能门限上限值" }

  # 0x0C05 — 24小时性能门限查询
  # 结构体同 0x0C04
  - cmdCode: 0x0C05
    operation: "24小时性能门限查询"
    request:
      className: "PerfThreshold24HGetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  default: 0xFF,   desc: "子架序号" }
        - { name: slotId,          type: BYTE,  default: 0xFF,   desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, default: 0xFFFF, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, default: 0xFFFF, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
    response:
      className: "PerfThreshold24HQueryResult"
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: thresholdUpper,  type: INT,   desc: "性能门限上限值" }
  - cmdCode: 0x0C07
    operation: "查询当前24小时性能"
    request:
      className: "PerfCurrent24HGetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "物理端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号（0=物理端口本身）" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（0xFFFF=包括物理端口号, 0=物理端口, 非0非0xFFFF=指定时隙）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
    response:
      className: "PerfCurrent24HQueryResult"
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号（bit7=Invalid PM, 0=有效/1=无效; bit6=高/低32位指示, 0=低32位/1=高32位）" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "物理端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号（0=物理端口本身）" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（用于描述级联）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: performanceValue, type: INT,  desc: "性能值" }
        - { name: perTime,         type: INT,   desc: "性能时间（Unix时间戳，相对于1970年的秒数）" }

  # ===================================================================
  #  查询历史15分钟/24小时性能 — 0x0C08 / 0x0C09
  # ===================================================================

  # 0x0C08 — 查询历史15分钟性能
  # C 请求: STRU_PEF_Qx_History_Get (20 bytes)
  # C 响应: STRU_PEF_Qx_Active_Rpt (复用 trap 结构体)
  - cmdCode: 0x0C08
    operation: "查询历史15分钟性能"
    request:
      className: "PerfHistory15MGetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "物理端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号（0=物理端口本身）" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（0xFFFF=包括物理端口号, 0=物理端口, 非0非0xFFFF=指定时隙）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: startTime,       type: INT,   desc: "查询起始时间（Unix时间戳）" }
        - { name: stopTime,        type: INT,   desc: "查询结束时间（Unix时间戳）" }
    response:
      className: "PerfHistory15MQueryResult"
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号（bit7=Invalid PM, 0=有效/1=无效; bit6=高/低32位指示, 0=低32位/1=高32位）" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "物理端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号（0=物理端口本身）" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（用于描述级联）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: performanceValue, type: INT,  desc: "性能值" }
        - { name: perTime,         type: INT,   desc: "性能时间（Unix时间戳，相对于1970年的秒数）" }

  # 0x0C09 — 查询历史24小时性能
  # 结构体同 0x0C08
  - cmdCode: 0x0C09
    operation: "查询历史24小时性能"
    request:
      className: "PerfHistory24HGetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "物理端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号（0=物理端口本身）" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（0xFFFF=包括物理端口号, 0=物理端口, 非0非0xFFFF=指定时隙）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: startTime,       type: INT,   desc: "查询起始时间（Unix时间戳）" }
        - { name: stopTime,        type: INT,   desc: "查询结束时间（Unix时间戳）" }
    response:
