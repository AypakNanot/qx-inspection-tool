# 源文档: Qx接口-C07 性能管理.docx
#   覆盖: 性能数据查询(当前/历史 15min+24h) + 屏蔽设置 + 门限设置 + 维护操作(复位/归零/上报开关)
schema:
  namespace: "perf"

messages:

  - cmdCode: 0x0C07
    operation: "查询当前24小时性能"
    request:
      className: "PerfCurrent24HGetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "物理端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号（0=物理端口本身）" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（0xFFFF=包括物理端口号, 0=物理端口, 非0非0xFFFF=指定时隙）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
    response:
      className: "PerfCurrent24HQueryResult"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号（bit7=Invalid PM, 0=有效/1=无效; bit6=高/低32位指示, 0=低32位/1=高32位）" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "物理端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号（0=物理端口本身）" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（用于描述级联）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: performanceValue, type: INT,  desc: "性能值" }
        - { name: perTime,         type: INT,   desc: "性能时间（Unix时间戳，相对于1970年的秒数）" }

  # ===================================================================
  #  查询历史15分钟/24小时性能 — 0x0C08 / 0x0C09
  # ===================================================================

  # 0x0C08 — 查询历史15分钟性能
  # C 请求: STRU_PEF_Qx_History_Get (20 bytes)
  # C 响应: STRU_PEF_Qx_Active_Rpt (复用 trap 结构体)
  - cmdCode: 0x0C08
    operation: "查询历史15分钟性能"
    request:
      className: "PerfHistory15MGetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "物理端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号（0=物理端口本身）" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（0xFFFF=包括物理端口号, 0=物理端口, 非0非0xFFFF=指定时隙）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: startTime,       type: INT,   desc: "查询起始时间（Unix时间戳）" }
        - { name: stopTime,        type: INT,   desc: "查询结束时间（Unix时间戳）" }
    response:
      className: "PerfHistory15MQueryResult"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号（bit7=Invalid PM, 0=有效/1=无效; bit6=高/低32位指示, 0=低32位/1=高32位）" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "物理端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号（0=物理端口本身）" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（用于描述级联）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: performanceValue, type: INT,  desc: "性能值" }
        - { name: perTime,         type: INT,   desc: "性能时间（Unix时间戳，相对于1970年的秒数）" }

  # 0x0C09 — 查询历史24小时性能
  # 结构体同 0x0C08
  - cmdCode: 0x0C09
    operation: "查询历史24小时性能"
    request:
      className: "PerfHistory24HGetData"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "物理端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号（0=物理端口本身）" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（0xFFFF=包括物理端口号, 0=物理端口, 非0非0xFFFF=指定时隙）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: startTime,       type: INT,   desc: "查询起始时间（Unix时间戳）" }
        - { name: stopTime,        type: INT,   desc: "查询结束时间（Unix时间戳）" }
    response:
      className: "PerfHistory24HQueryResult"
      listRecord: true
      fields:
        - { name: subcaseNo,       type: BYTE,  desc: "子架序号（bit7=Invalid PM, 0=有效/1=无效; bit6=高/低32位指示, 0=低32位/1=高32位）" }
        - { name: slotId,          type: BYTE,  desc: "槽位序号" }
        - { name: portType,        type: BYTE,  desc: "端口类型" }
        - { name: portSubType,     type: BYTE,  desc: "端口子类型" }
        - { name: portId,          type: SHORT, desc: "物理端口号" }
        - { name: tsOrderId,       type: SHORT, desc: "端口内业务时隙顺序号（0=物理端口本身）" }
        - { name: tsAttribute,     type: SHORT, desc: "时隙带宽（用于描述级联）" }
        - { name: performanceCode, type: SHORT, desc: "性能代码" }
        - { name: performanceValue, type: INT,  desc: "性能值" }
        - { name: perTime,         type: INT,   desc: "性能时间（Unix时间戳，相对于1970年的秒数）" }
