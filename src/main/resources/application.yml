spring:
  application:
    name: qx-inspection-tool

  datasource:
    # SQLite数据源配置（本地缓存库）
    sqlite:
      url: "jdbc:sqlite:./data/qx_inspection.db?busy_timeout=5000&journal_mode=WAL"
      driver-class-name: org.sqlite.JDBC
      hikari:
        maximum-pool-size: 1
        minimum-idle: 1

  # JPA配置
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# 日志配置
logging:
  level:
    root: INFO
    com.optel: DEBUG
#    org.hibernate.SQL: DEBUG
#    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /qx-inspection

# 应用自定义配置
app:
  # 备份/恢复管理员认证令牌（必须配置，留空则禁用备份/恢复功能）
  admin-token: ""
  # MySQL 老网管库连接配置（生产环境请通过环境变量覆盖密码：APP_MYSQL_PASSWORD）
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "Uniview"
    username: "sa"
    password: "DB_Admin123"
  # MySQL → SQLite 动态同步配置
  sync:
    # 必要表（同步模式=essential时，只同步这些）
    essential:
      - dmne
      - defdmne
      - emnecomm
      - dmrelation
      - dmeo
      - dmnet
      - defdmnetwork
    # 批量写入大小
    batch-size: 5000
    # 排除的表（不同步，如系统内部表）
    exclude: []
  # Qx协议连接配置
  qx:
    connect-timeout-ms: 5000
    login-timeout-sec: 20
    heartbeat-interval-sec: 60
    heartbeat-timeout-sec: 180
    business-threads: 4
    # 重连配置
    reconnect:
      base-sec: 5
      max-sec: 300
      max-concurrent: 10
      circuit-threshold: 5
      circuit-cooldown-sec: 300
  # 巡检配置
  inspection:
    concurrency: 10
    max-rounds: 10
    # 光口端口过滤：dmeo表 cid=5 且 defName 匹配的模式（OR逻辑，支持扩展）
    port-defname-patterns: "STM%,GE%,10GE%,40GE%,100GE%"
    # 定时巡检配置
    scheduled:
      enabled: false
      cron: "0 0 2 * * ?"   # 默认每天凌晨2点
      scope: ALL             # ALL / NETWORK
      network: ""            # scope=NETWORK时指定网络名
