spring:
  application:
    name: qx-inspection-tool
  
  # 主数据源配置 - MySQL（老库只读）
  datasource:
    mysql:
      url: jdbc:mysql://127.0.0.1:3306/Uniview?useUnicode=true&characterEncoding=GBK&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: root123
      driver-class-name: com.mysql.jdbc.Driver
      # 连接池配置
      hikari:
        maximum-pool-size: 10
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    
    # SQLite数据源配置（本地缓存库）
    sqlite:
      url: jdbc:sqlite:./data/qx_inspection.db
      driver-class-name: org.sqlite.JDBC
      # SQLite不需要用户名密码
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1

  # JPA配置（各数据源方言和ddl-auto在Config类中单独设置）
  jpa:
    open-in-view: false

# 日志配置
logging:
  level:
    root: INFO
    com.optel: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /qx-inspection

# 应用自定义配置
app:
  # Qx协议连接配置
  qx:
    connect-timeout-ms: 5000
    login-timeout-sec: 20
    heartbeat-interval-sec: 60
    heartbeat-timeout-sec: 180
    business-threads: 4
    # 重连配置
    reconnect:
      base-sec: 5
      max-sec: 300
      max-concurrent: 10
      circuit-threshold: 5
      circuit-cooldown-sec: 300
  # 巡检配置
  inspection:
    concurrency: 10
    max-rounds: 10
    # 光口端口过滤：dmeo表 cid=5 且 defName 匹配的模式（OR逻辑，支持扩展）
    port-defname-patterns: "STM%,GE%,10GE%,40GE%,100GE%"
    # 定时巡检配置
    scheduled:
      enabled: false
      cron: "0 0 2 * * ?"   # 默认每天凌晨2点
      scope: ALL             # ALL / NETWORK
      network: ""            # scope=NETWORK时指定网络名
