spring:
  application:
    name: qx-inspection-tool

  datasource:
    # SQLite数据源配置（本地缓存库）
    sqlite:
      url: "jdbc:sqlite:./data/qx_inspection.db?busy_timeout=5000&journal_mode=WAL"
      driver-class-name: org.sqlite.JDBC
      hikari:
        maximum-pool-size: 1
        minimum-idle: 1

  # JPA配置
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# 日志配置
logging:
  level:
    root: INFO
    com.optel: DEBUG
#    org.hibernate.SQL: DEBUG
#    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 服务器配置
server:
  port: 38543
  servlet:
    context-path: /

# 应用自定义配置
app:
  # 备份/恢复管理员认证令牌（必须配置，留空则禁用备份/恢复功能）
  admin-token: ""
  # MySQL 老网管库连接配置（生产环境请通过环境变量覆盖密码：APP_MYSQL_PASSWORD）
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "Uniview"
    username: "sa"
    password: "DB_Admin123"
  # Qx协议连接配置
  qx:
    connect-timeout-ms: 5000
    login-timeout-sec: 20
    heartbeat-interval-sec: 60
    heartbeat-timeout-sec: 180
    business-threads: 4
    # 重连配置
    reconnect:
      base-sec: 5
      max-sec: 300
      max-concurrent: 10
      circuit-threshold: 5
      circuit-cooldown-sec: 300
  # 巡检配置
  inspection:
    concurrency: 10
    max-rounds: 10
  # 门限预置值（单位 dBm）。type 为设备侧模块类型键（toModuleTypeName 输出）。
  # 初始化/刷新目标值；用户在界面改过的值以数据库为准，不受此表影响。
  threshold:
    presets:
      # ---- STM-1 ----
      - rate: STM-1
        type: S1.1
        tx-high: -8
        tx-low: -15
        rx-high: -8
        rx-low: -28
        description: "155M+S档(中距,G.957 S-1.1/S-1.2)"
      - rate: STM-1
        type: L1.1
        tx-high: 0
        tx-low: -5
        rx-high: -10
        rx-low: -34
        description: "155M+L档(长距,G.957 L-1.1~L-1.3)"
      - rate: STM-1
        type: L1.2
        tx-high: 0
        tx-low: -5
        rx-high: -10
        rx-low: -34
        description: "155M+V档(超长距,G.957 L-1.2)"
      # ---- STM-4 ----
      - rate: STM-4
        type: S4.1
        tx-high: -8
        tx-low: -15
        rx-high: -8
        rx-low: -28
        description: "622M+S档(中距,G.957 S-4.1/S-4.2)"
      - rate: STM-4
        type: L4.1
        tx-high: 2
        tx-low: -3
        rx-high: -8
        rx-low: -28
        description: "622M+L档(长距,G.957 L-4.1~L-4.3)"
      - rate: STM-4
        type: L4.2
        tx-high: 2
        tx-low: -3
        rx-high: -8
        rx-low: -28
        description: "622M+V档(超长距,G.957 L-4.2)"
      # ---- STM-16 ----
      - rate: STM-16
        type: I16.1
        tx-high: -3
        tx-low: -10
        rx-high: -3
        rx-low: -18
        description: "2.5G+I档(短距,G.957 I-16)"
      - rate: STM-16
        type: S16.1
        tx-high: 0
        tx-low: -5
        rx-high: 0
        rx-low: -18
        description: "2.5G+S档(中距,G.957 S-16.1/S-16.2)"
      - rate: STM-16
        type: L16.1
        tx-high: 3
        tx-low: -2
        rx-high: -9
        rx-low: -27
        description: "2.5G+L档(长距,G.957 L-16.1)"
      - rate: STM-16
        type: L16.2
        tx-high: 3
        tx-low: -2
        rx-high: -9
        rx-low: -28
        description: "2.5G+V档(超长距,G.957 L-16.2)"
      # ---- STM-64 ----
      - rate: STM-64
        type: I64.1
        tx-high: -1
        tx-low: -6
        rx-high: -1
        rx-low: -11
        description: "10G+I档(短距,G.691 I-64.1)"
      - rate: STM-64
        type: S64.2b
        tx-high: 2
        tx-low: -1
        rx-high: -1
        rx-low: -14
        description: "10G+S档(中距,G.691 S-64.2b)"
      - rate: STM-64
        type: L64.2          # 设备键 L64.2，取 G.691 L-64.2a 的值
        tx-high: 2
        tx-low: -2
        rx-high: -9
        rx-low: -26
        description: "10G+L档(长距,G.691 L-64.2a)"
      - rate: STM-64
        type: V64.2          # 设备键 V64.2，取 G.691 L-64.2c 的值
        tx-high: 2
        tx-low: -2
        rx-high: -9
        rx-low: -26
        description: "10G+V档(超长距,G.691 L-64.2c)"
