spring:
  application:
    name: qx-inspection-tool
  
  # 主数据源配置 - MySQL（老库只读）
  datasource:
    mysql:
      url: jdbc:mysql://127.0.0.1:3306/Uniview?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: root123
      driver-class-name: com.mysql.jdbc.Driver
      # 连接池配置
      hikari:
        maximum-pool-size: 10
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    
    # SQLite数据源配置（本地缓存库）
    sqlite:
      url: jdbc:sqlite:./data/qx_inspection.db
      driver-class-name: org.sqlite.JDBC
      # SQLite不需要用户名密码
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1

  # JPA配置（各数据源方言和ddl-auto在Config类中单独设置）
  jpa:
    open-in-view: false

# 日志配置
logging:
  level:
    root: INFO
    com.optel: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /qx-inspection

# 应用自定义配置
app:
  # 设备接入配置
  device:
    # 默认用户名（独立用户）
    default-username: inspection_user
    # 默认密码
    default-password: inspection_pwd
    # 连接超时（毫秒）
    connection-timeout: 5000
    # 读取超时（毫秒）
    read-timeout: 10000
  
  # 巡检任务配置
  inspection:
    # 巡检周期（小时）
    interval-hours: 24
    # 光功率门限
    optical-power:
      # 低光功率门限（dBm）
      low-threshold: -30
      # 高光功率门限（dBm）
      high-threshold: -10
